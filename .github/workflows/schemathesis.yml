name: Schemathesis (manual)

# Uji properti rute /api/v1 web terhadap openapi.yaml backend. Hanya manual (workflow_dispatch):
# memakan beberapa menit dan tidak boleh menahan PR. Lihat ADR-0005.
on:
  workflow_dispatch:
    inputs:
      spec_ref:
        description: Ref pawonee-backend-service tempat docs/api/openapi.yaml diambil
        default: main
        required: false
      maks_contoh:
        description: Jumlah contoh maksimum per operasi
        default: '25'
        required: false

permissions:
  contents: read

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPEC_REF: ${{ inputs.spec_ref }}
      MAKS_CONTOH: ${{ inputs.maks_contoh }}
      # Telemetry alat uji dimatikan; tidak ada data keluar ke layanan eksternal.
      SCHEMATHESIS_TELEMETRY: 'off'
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Jalankan Schemathesis
        run: contract/schemathesis.sh
      - name: Unggah laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-schemathesis
          path: contract/laporan/
          retention-days: 14
